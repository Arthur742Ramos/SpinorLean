status:
  scope: >-
    The selected Challenge theorem is stated for a field K with invertible 2,
    a finite-dimensional K-module V, a finite-dimensional submodule W with a
    finite basis, and a linear automorphism g of W.  It identifies membership
    of the hyperbolic transport of g in the ambient spin-isometry range with
    the existence of a square-unit determinant.  The basis and a selected
    basis vector are explicit proof data for the constructive direction.  The
    repository additionally contains the full chosen exterior-model,
    half-spin, kernel, projective, split-line, square-class, norm, and selected
    low-dimensional classification APIs documented in README.md and
    THEOREM_INDEX.md.  It does not claim a full all-orthogonal-group image
    classification, a global spinor-norm theorem for arbitrary orthogonal
    decompositions, spinor bundles, Dirac operators, or a scheme-theoretic
    construction.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["GPT-5 Codex"]
      framework: "Lean 4, Lake, and Mathlib"
      tool_setup: >-
        AI-assisted repository preparation and proof review, with the
        substantive Lean proof development retained in Spinor/ and the
        Palomar Challenge/Solution boundary checked separately.
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based"
        hardware: "local machine and GitHub Actions"
        prompting_notes: "Repository-scoped implementation, audit, and verification."
  spend_usd: "subscription-based"
  notes: >-
    The formalization was developed against the pinned Lean and Mathlib
    revisions.  The final preparation is checked by the Lean kernel, the
    repository no-hole scan, and the pinned Comparator workflow with NanoDa
    replay.  No human peer review is claimed by this metadata.

fidelity:
  divergences: >-
    The public arXiv v1 record states the split-Levi criterion in the paper's
    special-orthogonal formulation and advertises a rank-at-least-three
    version.  The current repository proves an equivalent ambient-isometry
    range formulation and exposes a more general finite-basis theorem; the
    Challenge records the current theorem's actual hypotheses rather than
    silently importing the older paper restriction.  The Palomar entry covers
    this selected theorem, not every theorem listed in the repository or
    paper.  Standard exterior-model and low-dimensional classification facts
    are identified as classical background; no novelty or priority claim is
    made here.

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: >-
    The Challenge was written as a Mathlib-only, statement-facing capsule and
    the Solution connects it to the existing SpinorLean proof.  The repository
    is checked with the full Lean build, proof-hole scan, source-size and
    metadata audits, and the pinned Comparator/NanoDa workflow.  No independent
    human peer review is claimed.

alignment:
  namespace: "Palomar"
  statements:
    - source: "Square-determinant Levi factorization and exact spin-image criterion (Theorem thm:square-det-levi)"
      lean: "Palomar.splitLevi_mem_spin_isometry_range_iff_det_square"
      module: "Challenge.lean and Solution.lean"
      status: "adapted"
      note: >-
        The compared declaration is the equivalent ambient-isometry statement:
        the hyperbolic isometry induced by g lies in the spin-isometry range
        exactly when det(g) is a square unit.  The proof is instantiated from
        Spinor's special-orthogonal range theorem, with the subtype coercions
        made explicit in Solution.lean.

