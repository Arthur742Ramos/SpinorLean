version: "v0.4"

project:
  name: "Exterior-model spinors in split rank"
  description: >-
    Formalizes an exterior-model spinor construction for a field K in which 2
    is invertible, using an explicit hyperbolic presentation and the Clifford
    conjugation action on the ambient quadratic space.  The development
    proves field-sensitive covering and image results: the positive split-rank
    spin-to-isometry kernel is {1,-1}, the spin action therefore descends only
    projectively, the split-line image is exactly the square-scaling subgroup,
    and a finite-dimensional split Levi element associated to g lies in the
    ambient spin image exactly when det(g) is a square unit.  The repository
    also packages the chosen exterior model, half-spin pieces, explicit
    transvection and square-scaling Clifford lifts, square-class quotient
    characters, vector-product norm identities, and selected complex and real
    low-dimensional Clifford classifications.
  authors:
    - "Arthur F. Ramos"
    - "David B. Hulak"
    - "Ruy J. G. B. de Queiroz"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Arthur F. Ramos"

